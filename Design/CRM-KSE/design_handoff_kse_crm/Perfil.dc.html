<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/tokens/colors.css">
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/tokens/typography.css">
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/tokens/effects.css">
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/tokens/aliases.css">
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/styles.css">
  <script src="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/_ds_bundle.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeup  { from { opacity: 0; transform: translateY(8px); }  to { opacity: 1; transform: translateY(0); } }
    @keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* Role badges */
    .b-owner  { background: var(--brand-100); color: var(--brand-700);  border: 1px solid var(--brand-200); border-radius: var(--radius-full); padding: 3px 12px; font-size: var(--text-xs); font-weight: 600; }
    .b-vendor { background: var(--info-50);   color: var(--info-600);   border: 1px solid var(--info-100);  border-radius: var(--radius-full); padding: 3px 12px; font-size: var(--text-xs); font-weight: 600; }

    /* Mobile-only elements */
    .bot-nav  { display: flex; height: 64px; background: var(--bg-surface); border-top: 1px solid var(--border); flex-shrink: 0; }
    .drag-hdl { width: 40px; height: 4px; background: var(--neutral-200); border-radius: 9999px; margin: 14px auto 6px; }

    /* Panel — base = mobile (bottom sheet) */
    .pan-backdrop { position: fixed; inset: 0; z-index: 50; background: oklch(0 0 0 / 0.42); }
    .prof-panel   {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 51;
      background: var(--bg-surface);
      border-radius: 20px 20px 0 0;
      box-shadow: var(--shadow-lg);
      animation: slideup 240ms cubic-bezier(0.32, 0.72, 0, 1) both;
    }
    .nav-btn { flex: 1; height: 100%; border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--text-tertiary); font-family: var(--font-family); }
    .nav-btn.active { color: var(--interactive); }

    /* Desktop overrides */
    @media (min-width: 768px) {
      .bot-nav  { display: none; }
      .drag-hdl { display: none; }
      .pan-backdrop { background: transparent; }
      .prof-panel {
        bottom: auto; top: 64px; right: 20px; left: auto;
        width: 296px;
        border-radius: var(--radius-xl);
        border: 1px solid var(--border);
        animation: fadeup 160ms ease both;
      }
    }
  </style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg-page);font-family:var(--font-family)">

  <!-- ── HEADER ─────────────────────────────────── -->
  <div style="height:56px;background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:6px;flex-shrink:0">
    <span style="font-size:20px;font-weight:700;color:var(--interactive);letter-spacing:-0.02em;line-height:1">KSE</span>
    <span style="font-size:10px;font-weight:600;color:var(--text-tertiary);letter-spacing:0.14em;text-transform:uppercase;margin-top:2px">CRM</span>
    <div style="flex:1"></div>
    <!-- Bell -->
    <button type="button" style="width:40px;height:40px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);border-radius:var(--radius-md)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <!-- Avatar trigger -->
    <button type="button" onClick="{{ openPanel }}" aria-label="Abrir menú de perfil" style="width:40px;height:40px;border:none;background:transparent;cursor:pointer;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center">
      <x-import component-from-global-scope="KSECRMDesignSystem_a08b7d.Avatar" name="{{ userName }}" size="sm" hint-size="32px,32px"></x-import>
    </button>
  </div>

  <!-- ── MAIN (mock dashboard) ──────────────────── -->
  <div style="flex:1;padding:24px 16px;max-width:720px;width:100%;margin:0 auto">
    <div style="margin-bottom:20px">
      <div style="font-size:22px;font-weight:700;color:var(--text-primary);line-height:1.2">{{ greeting }}</div>
      <div style="font-size:13px;color:var(--text-secondary);margin-top:3px">Jueves, 26 jun 2026</div>
    </div>
    <!-- Stats -->
    <div style="display:flex;gap:8px;margin-bottom:24px">
      <div style="flex:1;background:var(--error-50);border-radius:var(--radius-lg);padding:12px"><div style="font-size:26px;font-weight:700;color:var(--error-600);line-height:1">2</div><div style="font-size:11px;font-weight:500;color:var(--error-600);opacity:.8;margin-top:3px">Atrasados</div></div>
      <div style="flex:1;background:var(--brand-50);border-radius:var(--radius-lg);padding:12px"><div style="font-size:26px;font-weight:700;color:var(--brand-700);line-height:1">3</div><div style="font-size:11px;font-weight:500;color:var(--brand-700);opacity:.8;margin-top:3px">Para hoy</div></div>
      <div style="flex:1;background:var(--success-50);border-radius:var(--radius-lg);padding:12px"><div style="font-size:26px;font-weight:700;color:var(--success-700);line-height:1">1</div><div style="font-size:11px;font-weight:500;color:var(--success-700);opacity:.8;margin-top:3px">Ganados</div></div>
    </div>
    <!-- Mock clients -->
    <div style="font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">Atrasados — 2</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--brand-100);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--brand-700);flex-shrink:0">MG</div>
        <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">María García</div><div style="font-size:12px;color:var(--text-secondary)">Tienda El Sol</div></div>
        <span style="background:var(--error-50);color:var(--error-600);border:1px solid var(--error-200);border-radius:var(--radius-full);padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap">Atrasado</span>
      </div>
      <div style="background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--info-50);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--info-600);flex-shrink:0">RM</div>
        <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Roberto Méndez</div><div style="font-size:12px;color:var(--text-secondary)">Taquería Los Compadres</div></div>
        <span style="background:var(--error-50);color:var(--error-600);border:1px solid var(--error-200);border-radius:var(--radius-full);padding:2px 8px;font-size:11px;font-weight:600;white-space:nowrap">Atrasado</span>
      </div>
    </div>
  </div>

  <!-- ── BOTTOM NAV (mobile only) ───────────────── -->
  <nav class="bot-nav">
    <button type="button" class="nav-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span style="font-size:10px">Inicio</span>
    </button>
    <button type="button" class="nav-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span style="font-size:10px">Clientes</span>
    </button>
    <!-- FAB -->
    <button type="button" style="flex:1;height:100%;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center">
      <div style="width:50px;height:50px;border-radius:50%;background:var(--interactive);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 14px oklch(0.63 0.195 48/0.40)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
    </button>
    <button type="button" class="nav-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span style="font-size:10px">Reportes</span>
    </button>
    <!-- Perfil — active -->
    <button type="button" class="nav-btn active" onClick="{{ openPanel }}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span style="font-size:10px;font-weight:600">Perfil</span>
    </button>
  </nav>

  <!-- ── PROFILE PANEL ──────────────────────────── -->
  <sc-if value="{{ panelOpen }}" hint-placeholder-val="{{ true }}">
    <!-- Backdrop -->
    <div class="pan-backdrop" onClick="{{ closePanel }}"></div>

    <!-- Panel card -->
    <div class="prof-panel" role="dialog" aria-label="Perfil de usuario">
      <div class="drag-hdl"></div>

      <!-- User info block -->
      <div style="display:flex;flex-direction:column;align-items:center;padding:20px 24px 22px;text-align:center;gap:8px">
        <x-import component-from-global-scope="KSECRMDesignSystem_a08b7d.Avatar" name="{{ userName }}" size="xl" hint-size="64px,64px"></x-import>
        <div style="margin-top:2px">
          <div style="font-size:var(--text-lg);font-weight:700;color:var(--text-primary);line-height:1.25">{{ userName }}</div>
          <div style="font-size:var(--text-sm);color:var(--text-secondary);margin-top:4px">{{ userEmail }}</div>
        </div>
        <span class="{{ roleBadgeClass }}">{{ userRoleLabel }}</span>
      </div>

      <!-- Divider -->
      <div style="height:1px;background:var(--border-subtle);margin:0 0 6px"></div>

      <!-- Cerrar sesión -->
      <div style="padding:0 8px 12px">
        <button
          type="button"
          onClick="{{ handleLogout }}"
          disabled="{{ loggingOut }}"
          style="width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:transparent;border:none;cursor:pointer;border-radius:var(--radius-md);color:var(--error-600);font-family:var(--font-family);font-size:var(--text-base);font-weight:500;transition:background 120ms;text-align:left"
          style-hover="background: var(--error-50)"
        >
          <sc-if value="{{ loggingOut }}" hint-placeholder-val="{{ false }}">
            <div style="width:18px;height:18px;border:2px solid oklch(0.56 0.215 25/0.25);border-top-color:var(--error-500);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0"></div>
            Cerrando sesión…
          </sc-if>
          <sc-if value="{{ notLoggingOut }}" hint-placeholder-val="{{ true }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Cerrar sesión
          </sc-if>
        </button>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 800 },
  &quot;activeUser&quot;: {
    &quot;editor&quot;: &quot;enum&quot;,
    &quot;options&quot;: [&quot;marta&quot;, &quot;carlos&quot;],
    &quot;default&quot;: &quot;marta&quot;,
    &quot;tsType&quot;: &quot;string&quot;
  }
}">
class Component extends DCLogic {
  state = {
    panelOpen: true,   // abierto por defecto para mostrar el diseño
    loggingOut: false,
  };

  USERS = {
    marta:  { name: 'Marta López',  email: 'marta@ksecrm.mx',  role: 'dueña',    roleLabel: 'Dueña'    },
    carlos: { name: 'Carlos Rueda', email: 'carlos@ksecrm.mx', role: 'vendedor', roleLabel: 'Vendedor' },
  };

  renderVals() {
    const { panelOpen, loggingOut } = this.state;
    const key  = this.props.activeUser ?? 'marta';
    const user = this.USERS[key] || this.USERS.marta;

    const h     = new Date().getHours();
    const saludo = h < 12 ? 'Buenos días' : h < 18 ? 'Buenas tardes' : 'Buenas noches';

    return {
      /* Usuario */
      userName:      user.name,
      userEmail:     user.email,
      userRoleLabel: user.roleLabel,
      roleBadgeClass: user.role === 'dueña' ? 'b-owner' : 'b-vendor',
      greeting: `${saludo}, ${user.name.split(' ')[0]}`,

      /* Panel */
      panelOpen,
      loggingOut,
      notLoggingOut: !loggingOut,

      /* Handlers */
      openPanel:  () => this.setState({ panelOpen: true }),
      closePanel: () => this.setState({ panelOpen: false }),
      handleLogout: () => {
        this.setState({ loggingOut: true });
        setTimeout(() => { window.location.href = 'Login.dc.html'; }, 1000);
      },
    };
  }
}
</script>
</body>
</html>
