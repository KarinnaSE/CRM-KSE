<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/tokens/colors.css">
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/tokens/typography.css">
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/tokens/effects.css">
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/tokens/aliases.css">
  <link rel="stylesheet" href="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/styles.css">
  <script src="_ds/kse-crm-design-system-a08b7db0-b274-4233-af90-903960d91ea5/_ds_bundle.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Stage pill cards */
    .stage-pill {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      cursor: pointer; font-family: var(--font-family);
      text-align: left; width: 100%;
      transition: border-color 140ms, background 140ms;
    }
    .stage-pill:hover { background: var(--bg-surface-2); }
    .stage-pill.active-0 { border-color: var(--stage-1-border, var(--info-500));    background: var(--stage-1-bg, var(--info-50)); }
    .stage-pill.active-1 { border-color: var(--stage-2-border, var(--brand-400));   background: var(--stage-2-bg, var(--brand-50)); }
    .stage-pill.active-2 { border-color: var(--stage-3-border, var(--brand-500));   background: var(--stage-3-bg, var(--brand-100)); }
    .stage-pill.active-3 { border-color: var(--stage-4-border, var(--success-500)); background: var(--stage-4-bg, var(--success-50)); }
    .stage-pill.active-4 { border-color: var(--stage-5-border, var(--neutral-400)); background: var(--stage-5-bg, var(--neutral-100)); }

    /* Error banner */
    .err-banner { animation: fadein 160ms ease both; display: flex; align-items: flex-start; gap: 10px; background: var(--error-50); border: 1px solid var(--error-200); border-radius: var(--radius-md); padding: 12px 14px; }

    /* Desktop: 2-col stage grid */
    @media (min-width: 768px) {
      .stage-grid { display: grid !important; grid-template-columns: 1fr 1fr; gap: 8px; }
    }
  </style>
</helmet>

<div style="min-height:100vh;background:var(--bg-page);font-family:var(--font-family);display:flex;flex-direction:column">

  <!-- ── HEADER ─────────────────────────────────────── -->
  <div style="position:sticky;top:0;z-index:40;height:56px;background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px 0 4px;gap:0;flex-shrink:0">
    <!-- Cancel / back -->
    <button type="button" onClick="{{ handleCancel }}" style="height:56px;padding:0 12px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:var(--text-base);font-family:var(--font-family);font-weight:400;flex-shrink:0;transition:color 120ms" style-hover="color:var(--text-primary)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Cancelar
    </button>
    <!-- Title -->
    <div style="flex:1;text-align:center;font-size:var(--text-base);font-weight:600;color:var(--text-primary)">Nuevo cliente</div>
    <!-- Save CTA in header (desktop-friendly) -->
    <div style="flex-shrink:0;padding-right:8px">
      <x-import
        component-from-global-scope="KSECRMDesignSystem_a08b7d.Button"
        variant="primary" size="sm"
        onClick="{{ handleSave }}"
        disabled="{{ saving }}"
        hint-size="auto,36px">{{ headerSaveLabel }}</x-import>
    </div>
  </div>

  <!-- ── FORM ───────────────────────────────────────── -->
  <div style="flex:1;max-width:560px;width:100%;margin:0 auto;padding:28px 16px 64px">

    <form onSubmit="{{ handleFormSubmit }}" noValidate="{{ true }}" style="display:flex;flex-direction:column;gap:20px">

      <!-- Error banner -->
      <sc-if value="{{ hasErrors }}" hint-placeholder-val="{{ false }}">
        <div role="alert" class="err-banner">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--error-600)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <p style="font-size:var(--text-sm);color:var(--error-700);margin:0;line-height:1.5;text-wrap:pretty">{{ errorMsg }}</p>
        </div>
      </sc-if>

      <!-- ── Datos de contacto ── -->
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="font-size:var(--text-xs);font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em">Datos de contacto</div>

        <!-- Nombre -->
        <x-import
          component-from-global-scope="KSECRMDesignSystem_a08b7d.Input"
          label="Nombre completo"
          value="{{ name }}"
          onChange="{{ setName }}"
          placeholder="Ej. María García"
          required="{{ true }}"
          disabled="{{ saving }}"
          error="{{ nameError }}"
          hint-size="100%,auto">
        </x-import>

        <!-- Teléfono -->
        <x-import
          component-from-global-scope="KSECRMDesignSystem_a08b7d.Input"
          label="Teléfono"
          value="{{ phone }}"
          onChange="{{ setPhone }}"
          placeholder="+52 33 1234-5678"
          type="tel"
          disabled="{{ saving }}"
          error="{{ contactError }}"
          hint-size="100%,auto">
        </x-import>

        <!-- Email -->
        <x-import
          component-from-global-scope="KSECRMDesignSystem_a08b7d.Input"
          label="Correo electrónico"
          value="{{ email }}"
          onChange="{{ setEmail }}"
          placeholder="correo@ejemplo.com"
          type="email"
          disabled="{{ saving }}"
          helper="{{ emailHelper }}"
          hint-size="100%,auto">
        </x-import>
      </div>

      <!-- ── Etapa inicial ── -->
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:var(--text-xs);font-weight:700;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.06em">Etapa inicial</div>
        <div class="stage-grid" style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ stages }}" as="item" hint-placeholder-count="5">
            <button type="button" class="{{ item.cls }}" data-idx="{{ item.idx }}" onClick="{{ handleStageClick }}">
              <span style="width:8px;height:8px;border-radius:50%;background:{{ item.dot }};flex-shrink:0"></span>
              <div style="flex:1;min-width:0">
                <div style="font-size:var(--text-sm);font-weight:600;color:var(--text-primary);line-height:1.3">{{ item.label }}</div>
                <div style="font-size:var(--text-xs);color:var(--text-secondary);margin-top:2px;line-height:1.4">{{ item.desc }}</div>
              </div>
              <sc-if value="{{ item.active }}" hint-placeholder-val="{{ false }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--interactive)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </sc-if>
            </button>
          </sc-for>
        </div>
      </div>

      <!-- ── Botón Guardar (mobile, full-width) ── -->
      <div style="padding-top:4px">
        <x-import
          component-from-global-scope="KSECRMDesignSystem_a08b7d.Button"
          variant="primary" size="lg"
          type="submit"
          fullWidth="{{ true }}"
          disabled="{{ saving }}"
          hint-size="100%,48px">{{ saveBtnLabel }}</x-import>
      </div>

    </form>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 860 }
}">
class Component extends DCLogic {
  STAGES = [
    { label: 'Interesado',        desc: 'Contacto inicial, aún evaluando.',             dot: 'var(--info-500)'    },
    { label: 'En conversación',   desc: 'Hay diálogo activo con el cliente.',           dot: 'var(--brand-400)'   },
    { label: 'Propuesta enviada', desc: 'Se entregó propuesta, esperando respuesta.',   dot: 'var(--brand-600)'   },
    { label: 'Comprado',          desc: 'Venta cerrada exitosamente.',                   dot: 'var(--success-500)' },
    { label: 'Perdido',           desc: 'No prosperó. Se puede reactivar después.',     dot: 'var(--neutral-400)' },
  ];

  state = {
    name:         '',
    phone:        '',
    email:        '',
    stageIdx:     0,      // "Interesado" preseleccionado
    errors:       {},     // { name?, contact? }
    saving:       false,
  };

  validate() {
    const { name, phone, email } = this.state;
    const errs = {};
    if (!name.trim())                              errs.name    = 'El nombre es obligatorio.';
    if (!phone.trim() && !email.trim())            errs.contact = 'Ingresa al menos el teléfono o el correo electrónico.';
    return errs;
  }

  doSave = () => {
    if (this.state.saving) return;
    const errs = this.validate();
    if (Object.keys(errs).length) { this.setState({ errors: errs }); return; }
    this.setState({ saving: true, errors: {} });
    setTimeout(() => {
      const { name, phone, email, stageIdx } = this.state;
      const activeUser = this.props.activeUser ?? 'carlos';
      const registeredBy = activeUser === 'marta' ? 'Marta' : 'Carlos';
      const registeredAt = new Date().toLocaleDateString('es-MX', { day:'numeric', month:'short', year:'numeric' });
      const nu = { id: Date.now(), name: name.trim(), company: '', phone: phone.trim(), email: email.trim(), stage: stageIdx + 1, registeredBy, registeredAt };
      const existing = JSON.parse(localStorage.getItem('kse_extra_clients') || '[]');
      existing.push(nu);
      localStorage.setItem('kse_extra_clients', JSON.stringify(existing));
      // Actualizar store compartido para que Ficha lo encuentre por id
      const prev = JSON.parse(localStorage.getItem('kse_all_clients') || '[]');
      const ids = new Set(prev.map(c => c.id));
      if (!ids.has(nu.id)) prev.push(nu);
      localStorage.setItem('kse_all_clients', JSON.stringify(prev));
      window.location.href = `Ficha.dc.html?id=${nu.id}`;
    }, 900);
  };

  renderVals() {
    const { name, phone, email, stageIdx, errors, saving } = this.state;
    const allErrors = Object.values(errors).filter(Boolean);
    const hasErrors = allErrors.length > 0;
    const errorMsg  = hasErrors ? allErrors.join(' ') : '';

    // Spinner helper
    const spinner = React.createElement('div', {
      style: { width:'16px', height:'16px', border:'2px solid rgba(255,255,255,0.35)', borderTopColor:'#fff', borderRadius:'50%', animation:'spin 0.7s linear infinite', flexShrink:0 },
    });
    const makeSaveLabel = (text) => saving
      ? React.createElement('span', { style:{display:'flex',alignItems:'center',gap:'7px'} }, spinner, 'Guardando…')
      : text;

    const stages = this.STAGES.map((s, i) => ({
      ...s, idx: i, active: i === stageIdx,
      cls: 'stage-pill' + (i === stageIdx ? ` active-${i}` : ''),
    }));

    const contactError = errors.contact || null;

    return {
      /* Fields */
      name, phone, email,
      nameError:    errors.name    || null,
      contactError,
      emailHelper:  !contactError ? 'Necesitamos al menos el teléfono o el correo.' : null,

      /* Stages */
      stages,

      /* Errors */
      hasErrors, errorMsg,

      /* Save */
      saving,
      saveBtnLabel:    makeSaveLabel('Guardar'),
      headerSaveLabel: makeSaveLabel('Guardar'),

      /* Handlers */
      setName:  e => this.setState(s => ({ name:  e.target.value, errors: {...s.errors, name:null} })),
      setPhone: e => this.setState(s => ({ phone: e.target.value, errors: {...s.errors, contact:null} })),
      setEmail: e => this.setState(s => ({ email: e.target.value, errors: {...s.errors, contact:null} })),

      handleStageClick: e => this.setState({ stageIdx: parseInt(e.currentTarget.dataset.idx) }),
      handleSave:       () => this.doSave(),
      handleFormSubmit: e => { e.preventDefault(); this.doSave(); },
      handleCancel:     () => { window.history.back(); },
    };
  }
}
</script>
</body>
</html>
